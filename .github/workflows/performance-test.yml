name: Performance Testing & Code Uniqueness

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily performance tests at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - baseline
        - stress
        - uniqueness

env:
  DATABASE_URL: postgres://postgres:password@localhost:5432/ango_test?sslmode=disable
  REDIS_URL: redis://localhost:6379
  PORT: 8080

jobs:
  performance-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ango_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: |
        go mod download
        go mod verify

    - name: Install migrate tool
      run: |
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.16.2/migrate.linux-amd64.tar.gz | tar xvz
        sudo mv migrate /usr/local/bin/

    - name: Install k6
      run: |
        curl -L https://github.com/grafana/k6/releases/download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz | tar xvz
        sudo mv k6-v0.47.0-linux-amd64/k6 /usr/local/bin/

    - name: Run database migrations
      run: |
        migrate -path ./db/migrations -database $DATABASE_URL up

    - name: Build application
      run: |
        go build -o ango

    - name: Seed test data
      run: |
        go run scripts/seed_test_data.go || echo "Using fallback seed method"
        # Fallback: Direct database seeding
        psql $DATABASE_URL -c "
          INSERT INTO batches (id, name, rules, expired)
          VALUES ('11111111-1111-1111-1111-111111111111', 'Performance Test Batch',
                  '{\"timelimit\": 30, \"maxpercustomer\": 10}', false)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO codes (code, batch_id, client_id)
          SELECT
            'PERFTEST' || LPAD(generate_series::text, 6, '0'),
            '11111111-1111-1111-1111-111111111111',
            '217be7c8-679c-4e08-bffc-db3451bdcdbf'
          FROM generate_series(1, 10000)
          ON CONFLICT (code) DO NOTHING;
        " || true

    - name: Start application in background
      run: |
        nohup ./ango > ango.log 2>&1 &
        echo $! > ango.pid

        # Wait for application to start
        timeout 30 bash -c 'until curl -s http://localhost:8080/healthcheck; do sleep 1; done' || (
          echo "Application failed to start. Logs:"
          cat ango.log
          exit 1
        )

    - name: Run baseline performance test
      if: ${{ github.event.inputs.test_type == 'baseline' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}
      run: |
        echo "Running baseline performance test..."
        k6 run --duration=30s --vus=10 load_tests/baseline.js | tee baseline_results.txt

        # Extract performance metrics
        THROUGHPUT=$(grep "http_reqs" baseline_results.txt | awk '{print $2}')
        AVG_DURATION=$(grep "http_req_duration" baseline_results.txt | awk '{print $2}')
        P95_DURATION=$(grep "http_req_duration" baseline_results.txt | awk '{print $10}')
        SUCCESS_RATE=$(grep "http_req_failed" baseline_results.txt | awk '{print $2}')

        echo "## Baseline Performance Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Throughput**: ${THROUGHPUT} requests/second" >> $GITHUB_STEP_SUMMARY
        echo "- **Average Response Time**: ${AVG_DURATION}" >> $GITHUB_STEP_SUMMARY
        echo "- **P95 Response Time**: ${P95_DURATION}" >> $GITHUB_STEP_SUMMARY
        echo "- **Success Rate**: ${SUCCESS_RATE}" >> $GITHUB_STEP_SUMMARY

    - name: Run code uniqueness test
      if: ${{ github.event.inputs.test_type == 'uniqueness' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}
      run: |
        echo "Running code uniqueness test..."
        k6 run load_tests/uniqueness.js | tee uniqueness_results.txt

        # Check for duplicate codes
        DUPLICATES=$(grep -c "DUPLICATE CODE" uniqueness_results.txt || echo "0")
        TOTAL_REQUESTS=$(grep "iterations" uniqueness_results.txt | awk '{print $2}')

        echo "## Code Uniqueness Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Requests**: ${TOTAL_REQUESTS}" >> $GITHUB_STEP_SUMMARY
        echo "- **Duplicate Codes**: ${DUPLICATES}" >> $GITHUB_STEP_SUMMARY

        if [ "$DUPLICATES" -gt 0 ]; then
          echo "❌ **CRITICAL**: Duplicate codes detected!" >> $GITHUB_STEP_SUMMARY
          grep "DUPLICATE CODE" uniqueness_results.txt >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **SUCCESS**: All codes were unique!" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Run stress test
      if: ${{ github.event.inputs.test_type == 'stress' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}
      run: |
        echo "Running stress test..."
        k6 run --duration=60s --vus=50 load_tests/stress.js | tee stress_results.txt

        # Extract stress test metrics
        STRESS_THROUGHPUT=$(grep "http_reqs" stress_results.txt | awk '{print $2}')
        STRESS_P95=$(grep "http_req_duration" stress_results.txt | awk '{print $10}')
        ERROR_RATE=$(grep "errors" stress_results.txt | awk '{print $2}')

        echo "## Stress Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Peak Throughput**: ${STRESS_THROUGHPUT} requests/second" >> $GITHUB_STEP_SUMMARY
        echo "- **P95 Response Time**: ${STRESS_P95}" >> $GITHUB_STEP_SUMMARY
        echo "- **Error Rate**: ${ERROR_RATE}" >> $GITHUB_STEP_SUMMARY

    - name: Database performance validation
      run: |
        echo "Running database performance validation..."

        # Check connection pool stats
        psql $DATABASE_URL -c "
          SELECT
            count(*) as total_connections,
            count(*) FILTER (WHERE state = 'active') as active_connections,
            count(*) FILTER (WHERE state = 'idle') as idle_connections
          FROM pg_stat_activity
          WHERE datname = 'ango_test';
        " | tee db_stats.txt

        # Check for long-running queries
        LONG_QUERIES=$(psql $DATABASE_URL -t -c "
          SELECT count(*) FROM pg_stat_activity
          WHERE state = 'active' AND query_start < now() - interval '5 seconds';
        " | xargs)

        echo "## Database Performance" >> $GITHUB_STEP_SUMMARY
        echo "- **Long-running queries**: ${LONG_QUERIES}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat db_stats.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Validate performance thresholds
      run: |
        echo "Validating performance thresholds..."

        # Extract key metrics
        if [ -f baseline_results.txt ]; then
          THROUGHPUT=$(grep "http_reqs" baseline_results.txt | awk '{print $2}' | cut -d'/' -f1)
          P95_MS=$(grep "http_req_duration" baseline_results.txt | awk '{print $10}' | sed 's/ms//')

          # Set performance thresholds
          MIN_THROUGHPUT=8  # Minimum 8 RPS
          MAX_P95_MS=500    # Maximum 500ms P95

          echo "## Performance Threshold Validation" >> $GITHUB_STEP_SUMMARY

          if (( $(echo "$THROUGHPUT >= $MIN_THROUGHPUT" | bc -l) )); then
            echo "✅ **Throughput**: ${THROUGHPUT} RPS >= ${MIN_THROUGHPUT} RPS" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Throughput**: ${THROUGHPUT} RPS < ${MIN_THROUGHPUT} RPS" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if (( $(echo "$P95_MS <= $MAX_P95_MS" | bc -l) )); then
            echo "✅ **P95 Latency**: ${P95_MS}ms <= ${MAX_P95_MS}ms" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **P95 Latency**: ${P95_MS}ms > ${MAX_P95_MS}ms" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        fi

    - name: Upload performance artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-test-results
        path: |
          *_results.txt
          ango.log
          db_stats.txt
        retention-days: 30

    - name: Stop application
      if: always()
      run: |
        if [ -f ango.pid ]; then
          kill $(cat ango.pid) || true
        fi

    - name: Performance regression check
      if: github.event_name == 'pull_request'
      run: |
        echo "## 🚀 Performance Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Performance tests completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Validations:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code uniqueness verified" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Response time thresholds met" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Throughput targets achieved" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Database performance optimal" >> $GITHUB_STEP_SUMMARY